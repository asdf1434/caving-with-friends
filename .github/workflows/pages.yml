# Publishes public/ to GitHub Pages.
#
# No secrets are involved. Deployment is authorised by the
# short-lived OIDC token GitHub mints for this run, which is
# what `id-token: write` below grants.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the code, publish the site, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. A queued run waits rather than
# cancelling, so the last push always wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the game
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
